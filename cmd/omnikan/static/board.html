<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanban</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      padding: 24px;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      color: #1a1a2e;
      margin-bottom: 20px;
    }

    #board {
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }

    .column {
      flex: 1;
      background: #e4e8ef;
      border-radius: 8px;
      padding: 12px;
      min-width: 0;
    }

    .column-header {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #555;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .column-header .count {
      background: #ccc;
      border-radius: 10px;
      padding: 1px 7px;
      font-size: 0.7rem;
      font-weight: 600;
      color: #444;
    }

    .card {
      background: #fff;
      border-radius: 5px;
      padding: 10px 12px;
      margin-bottom: 8px;
      font-size: 0.875rem;
      color: #222;
      box-shadow: 0 1px 2px rgba(0,0,0,0.08);
      line-height: 1.4;
      word-break: break-word;
    }

    .card:last-child { margin-bottom: 0; }

    .card-title {
      margin-bottom: 6px;
    }

    .card-actions {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    .move-btn {
      font-size: 0.7rem;
      padding: 2px 8px;
      border: 1px solid #ddd;
      border-radius: 3px;
      background: #f5f5f5;
      color: #555;
      cursor: pointer;
      line-height: 1.6;
    }

    .move-btn:hover { background: #e8e8e8; border-color: #bbb; }
    .move-btn:disabled { opacity: 0.4; cursor: default; }

    .empty {
      font-size: 0.8rem;
      color: #999;
      text-align: center;
      padding: 12px 0;
    }

    #status {
      font-size: 0.75rem;
      color: #888;
      margin-top: 16px;
    }

    #error {
      color: #c0392b;
      font-size: 0.875rem;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <h1>Kanban</h1>
  <div id="board">
    <div class="column" id="col-backlog">
      <div class="column-header">Backlog <span class="count" id="cnt-backlog">0</span></div>
      <div class="cards" id="cards-backlog"></div>
    </div>
    <div class="column" id="col-ready">
      <div class="column-header">Ready <span class="count" id="cnt-ready">0</span></div>
      <div class="cards" id="cards-ready"></div>
    </div>
    <div class="column" id="col-inprogress">
      <div class="column-header">In Progress <span class="count" id="cnt-inprogress">0</span></div>
      <div class="cards" id="cards-inprogress"></div>
    </div>
    <div class="column" id="col-done">
      <div class="column-header">Done <span class="count" id="cnt-done">0</span></div>
      <div class="cards" id="cards-done"></div>
    </div>
  </div>
  <div id="status"></div>
  <div id="error"></div>

  <script>
    const COLUMNS = ["backlog", "ready", "inprogress", "done"];
    const COLUMN_LABELS = { backlog: "Backlog", ready: "Ready", inprogress: "In Progress", done: "Done" };
    // Columns a card can be moved to (done is excluded — complete in OmniFocus)
    const MOVABLE = ["backlog", "ready", "inprogress"];
    const REFRESH_MS = 600000;

    function renderColumn(col, tasks) {
      const cards = document.getElementById("cards-" + col);
      const count = document.getElementById("cnt-" + col);
      count.textContent = tasks.length;
      if (tasks.length === 0) {
        cards.innerHTML = '<div class="empty">No tasks</div>';
        return;
      }
      cards.innerHTML = tasks.map(function(t) { return cardHtml(t, col); }).join("");
    }

    function cardHtml(task, currentCol) {
      var btns = MOVABLE
        .filter(function(col) { return col !== currentCol; })
        .map(function(col) {
          return '<button class="move-btn" onclick="moveTask(\'' + task.id + '\',\'' + col + '\',this)">'
            + COLUMN_LABELS[col] + '</button>';
        })
        .join("");
      return '<div class="card">'
        + '<div class="card-title">' + escapeHtml(task.name) + '</div>'
        + '<div class="card-actions">' + btns + '</div>'
        + '</div>';
    }

    function moveTask(id, newCol, btn) {
      // Disable all buttons on the card while the request is in flight
      var card = btn.closest(".card");
      var buttons = card.querySelectorAll(".move-btn");
      buttons.forEach(function(b) { b.disabled = true; });

      fetch("/api/move", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: id, newCol: newCol })
      })
        .then(function(r) {
          if (!r.ok) throw new Error("HTTP " + r.status);
          // Reload the board to reflect the move
          loadBoard();
        })
        .catch(function(err) {
          setError("Failed to move task: " + err.message);
          buttons.forEach(function(b) { b.disabled = false; });
        });
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function setStatus(msg) {
      document.getElementById("status").textContent = msg;
    }

    function setError(msg) {
      document.getElementById("error").textContent = msg;
    }

    function loadBoard() {
      setError("");
      setStatus("Loading…");
      fetch("/api/board")
        .then(function(r) {
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.json();
        })
        .then(function(data) {
          COLUMNS.forEach(function(col) {
            renderColumn(col, data[col] || []);
          });
          setStatus("Last updated: " + new Date().toLocaleTimeString());
        })
        .catch(function(err) {
          setStatus("");
          setError("Failed to load board: " + err.message);
        });
    }

    loadBoard();
    setInterval(loadBoard, REFRESH_MS);
  </script>
</body>
</html>
