<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanban</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f3ee;
      display: flex;
      flex-direction: column;
      padding: 24px;
    }

    header {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: baseline;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      color: #c4622d;
    }

    #board {
      display: flex;
      gap: 16px;
      flex: 1;
      min-height: 0;
    }

    .column {
      flex: 1;  /* default: 25% each */
      background: #ede8e0;
      border-radius: 4px;
      padding: 12px;
      min-width: 0;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .cards {
      overflow-y: auto;
      flex: 1;
      min-height: 0;
    }

    .column.drag-over {
      background: #e0d8ce;
      border-color: #c4622d;
      outline: 2px solid #c4622d;
      outline-offset: -1px;
    }

    #col-inprogress.drag-over {
      background: #d8cfc4;
    }

    .column-header {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #b8a898;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .column-header .count {
      background: #d8d0c8;
      border-radius: 10px;
      padding: 1px 7px;
      font-size: 0.7rem;
      font-weight: 600;
      color: #a89888;
    }

    #col-inprogress { background: #e8ddd4; }
    #col-inprogress .column-header { color: #c4622d; }
    #col-inprogress .column-header .count { background: #c4622d; color: #fff; }

    .card {
      background: #fdfcfa;
      border-radius: 6px;
      border: 1px solid #ccc4b8;
      border-bottom: 3px solid #b8b0a4;
      padding: 10px 12px;
      margin-bottom: 8px;
      font-size: 0.875rem;
      color: #a89888;
      box-shadow: none;
      line-height: 1.4;
      word-break: break-word;
      cursor: grab;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .card:last-child { margin-bottom: 0; }
    .card.dragging { opacity: 0.4; cursor: grabbing; }

    #col-inprogress .card { color: #3a2e24; }

    .card.done {
      opacity: 0.45;
    }

    .card.done .card-name {
      text-decoration: line-through;
      color: #999;
    }

    .card-body {
      flex: 1;
      min-width: 0;
    }

    .card-name {
      line-height: 1.4;
    }

    .card-note {
      margin-top: 4px;
      font-size: 0.75rem;
      color: #8a7060;
      line-height: 1.4;
      white-space: pre-wrap;
    }

    .card-note a {
      color: #c4622d;
      text-decoration: none;
    }

    .card-note a:hover {
      text-decoration: underline;
    }

    .card-check {
      flex-shrink: 0;
      width: 16px;
      height: 16px;
      margin-top: 1px;
      cursor: pointer;
      accent-color: #c4622d;
    }

    .empty {
      font-size: 0.8rem;
      color: #999;
      text-align: center;
      padding: 12px 0;
    }

    #status-bar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
    }

    #status {
      font-size: 0.75rem;
      color: #b8a898;
    }

    #refresh-btn {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 0.75rem;
      color: #5a4030;
      background: #fdfcfa;
      border: 1px solid #ccc4b8;
      border-bottom: 3px solid #b8b0a4;
      border-radius: 6px;
      padding: 2px 10px;
      cursor: pointer;
      white-space: nowrap;
    }

    #refresh-btn:active {
      border-bottom-width: 1px;
      transform: translateY(2px);
    }

    .shortcut {
      font-size: 0.75rem;
      color: #b8a898;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    kbd {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 0.75rem;
      color: #5a4030;
      background: #fdfcfa;
      border: 1px solid #ccc4b8;
      border-radius: 5px;
      box-shadow: 0 2px 0 #ccc4b8;
      padding: 2px 8px;
      white-space: nowrap;
    }

    #error {
      color: #c0392b;
      font-size: 0.875rem;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Kanban</h1>
    <div class="shortcut">Quick entry <kbd>⌃⌥Space</kbd></div>
    <div id="status-bar">
      <div id="status"></div>
      <button id="refresh-btn" onclick="forceRefresh()">Refresh</button>
    </div>
  </header>
  <div id="board">
    <div class="column" id="col-backlog">
      <div class="column-header">Backlog <span class="count" id="cnt-backlog">0</span></div>
      <div class="cards" id="cards-backlog"></div>
    </div>
    <div class="column" id="col-ready">
      <div class="column-header">Ready <span class="count" id="cnt-ready">0</span></div>
      <div class="cards" id="cards-ready"></div>
    </div>
    <div class="column" id="col-inprogress" style="flex: 2">
      <div class="column-header">In Progress <span class="count" id="cnt-inprogress">0</span></div>
      <div class="cards" id="cards-inprogress"></div>
    </div>
  </div>
  <div id="error"></div>

  <script>
    const COLUMNS = ["backlog", "ready", "inprogress"];
    const REFRESH_MS = 600000;

    var dragEl = null;    // the card element being dragged
    var pendingMoves = 0; // count of in-flight move requests

    function incPending() {
      pendingMoves++;
      setStatus("Saving…");
    }

    function decPending() {
      pendingMoves--;
      if (pendingMoves <= 0) {
        pendingMoves = 0;
        setStatus("Last updated: " + new Date().toLocaleTimeString());
      }
    }

    function renderColumn(col, tasks) {
      const cards = document.getElementById("cards-" + col);
      const count = document.getElementById("cnt-" + col);
      count.textContent = tasks.length;
      if (tasks.length === 0) {
        cards.innerHTML = '<div class="empty">No tasks</div>';
      } else {
        cards.innerHTML = tasks.map(function(t) { return cardHtml(t, col); }).join("");
      }

      var col_el = document.getElementById("col-" + col);
      col_el.ondragover = function(e) {
        e.preventDefault();
        col_el.classList.add("drag-over");
      };
      col_el.ondragleave = function(e) {
        if (!col_el.contains(e.relatedTarget)) {
          col_el.classList.remove("drag-over");
        }
      };
      col_el.ondrop = function(e) {
        e.preventDefault();
        col_el.classList.remove("drag-over");
        if (!dragEl) return;

        var id = dragEl.dataset.id;
        var cardsEl = document.getElementById("cards-" + col);

        // Move card in the DOM immediately
        dragEl.classList.remove("dragging");
        cardsEl.appendChild(dragEl);
        updateColumnCounts();
        cleanEmptyPlaceholders();

        // Fire tag update in the background; reload on failure
        incPending();
        fetch("/api/move", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: id, newCol: col })
        })
          .then(function(r) {
            if (!r.ok) throw new Error("HTTP " + r.status);
            decPending();
          })
          .catch(function(err) {
            decPending();
            setError("Failed to move task: " + err.message);
            loadBoard();
          });

        dragEl = null;
      };
    }

    // Tracks pending completion timers: taskId -> setTimeout handle
    var completionTimers = {};

    function cardHtml(task, col) {
      var note = (col === "inprogress" && task.note)
        ? '<div class="card-note">' + linkify(escapeHtml(task.note)) + '</div>'
        : '';
      return '<div class="card" draggable="true" data-id="' + task.id + '"'
        + ' ondragstart="onDragStart(event)"'
        + ' ondragend="onDragEnd(event)">'
        + '<input type="checkbox" class="card-check" title="Mark complete"'
        + ' onchange="onCheckChange(event,\'' + task.id + '\')">'
        + '<div class="card-body">'
        + '<div class="card-name">' + escapeHtml(task.name) + '</div>'
        + note
        + '</div>'
        + '</div>';
    }

    function onCheckChange(e, id) {
      var checked = e.target.checked;
      var card = e.target.closest(".card");

      if (checked) {
        card.classList.add("done");
        // Prevent dragging while pending completion
        card.setAttribute("draggable", "false");

        incPending();
        fetch("/api/complete", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: id })
        })
          .then(function(r) {
            if (!r.ok) throw new Error("HTTP " + r.status);
            decPending();
          })
          .catch(function(err) {
            decPending();
            setError("Failed to complete task: " + err.message);
            card.classList.remove("done");
            card.setAttribute("draggable", "true");
            e.target.checked = false;
          });

        // After 60s, remove from board
        completionTimers[id] = setTimeout(function() {
          delete completionTimers[id];
          card.remove();
          updateColumnCounts();
          cleanEmptyPlaceholders();
        }, 60000);

      } else {
        // Undo: cancel the removal timer and mark incomplete
        if (completionTimers[id]) {
          clearTimeout(completionTimers[id]);
          delete completionTimers[id];
        }
        card.classList.remove("done");
        card.setAttribute("draggable", "true");

        incPending();
        fetch("/api/incomplete", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: id })
        })
          .then(function(r) {
            if (!r.ok) throw new Error("HTTP " + r.status);
            decPending();
          })
          .catch(function(err) {
            decPending();
            setError("Failed to undo completion: " + err.message);
            loadBoard();
          });
      }
    }

    function onDragStart(e) {
      dragEl = e.currentTarget;
      dragEl.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
    }

    function onDragEnd(e) {
      e.currentTarget.classList.remove("dragging");
    }

    // Update the card counts in each column header after a DOM move.
    function updateColumnCounts() {
      COLUMNS.forEach(function(col) {
        var cards = document.getElementById("cards-" + col).querySelectorAll(".card");
        document.getElementById("cnt-" + col).textContent = cards.length;
      });
    }

    // Replace empty columns with the "No tasks" placeholder if needed,
    // and remove stale placeholders from columns that now have cards.
    function cleanEmptyPlaceholders() {
      COLUMNS.forEach(function(col) {
        var cardsEl = document.getElementById("cards-" + col);
        var cards = cardsEl.querySelectorAll(".card");
        var empty = cardsEl.querySelector(".empty");
        if (cards.length === 0 && !empty) {
          cardsEl.innerHTML = '<div class="empty">No tasks</div>';
        } else if (cards.length > 0 && empty) {
          empty.remove();
        }
      });
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // Linkify URLs in already-escaped HTML. Matches http(s):// URLs and
    // wraps them in an anchor tag. Must run after escapeHtml.
    function linkify(escaped) {
      return escaped.replace(
        /https?:\/\/[^\s<>"']*/g,
        function(url) {
          return '<a href="' + url + '" target="_blank" rel="noopener">' + url + '</a>';
        }
      );
    }

    function setStatus(msg) {
      document.getElementById("status").textContent = msg;
    }

    function setError(msg) {
      document.getElementById("error").textContent = msg;
    }

    function forceRefresh() {
      loadBoard(true);
    }

    function loadBoard(force) {
      setError("");
      setStatus(force ? "Refreshing…" : "Loading…");
      fetch(force ? "/api/board?force=true" : "/api/board")
        .then(function(r) {
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.json();
        })
        .then(function(data) {
          COLUMNS.forEach(function(col) {
            renderColumn(col, data[col] || []);
          });
          setStatus("Last updated: " + new Date().toLocaleTimeString());
        })
        .catch(function(err) {
          setStatus("");
          setError("Failed to load board: " + err.message);
        });
    }

    loadBoard();
    setInterval(loadBoard, REFRESH_MS);
  </script>
</body>
</html>
