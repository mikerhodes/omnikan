<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanban</title>
  <link rel="stylesheet" href="/static/ember.css">
  <link rel="stylesheet" href="/static/umber-light.css" media="(prefers-color-scheme: light)">
  <link rel="stylesheet" href="/static/umber-dark.css"  media="(prefers-color-scheme: dark)">
  <style>
    body {
      flex-direction: column;
      padding: 16px;
      height: 100vh;
    }

    header {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: baseline;
      margin-bottom: 12px;
    }

    header h1 {
      font-family: monospace;
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--accent);
    }

    #board {
      display: flex;
      gap: 16px;
      flex: 1;
      min-height: 0;
    }

    .column {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .cards {
      overflow-y: auto;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .column.drag-over {
      background: var(--focus-container-bg);
      outline: 2px solid var(--drag-outline);
      outline-offset: -1px;
    }

    .column-header {
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card {
      cursor: grab;
      display: flex;
      align-items: flex-start;
      gap: 8px;
      color: var(--text-muted);
      word-break: break-word;
    }

    .card.dragging { opacity: 0.4; cursor: grabbing; }

    .column.active .card { color: var(--text-active); }

    .card.done { opacity: 0.45; }

    .card.done .card-name {
      text-decoration: line-through;
      color: var(--ui-chrome);
    }

    .card-body {
      flex: 1;
      min-width: 0;
    }

    .card-name { line-height: 1.4; }

    .card-note {
      margin-top: 4px;
      margin-left: 0;
      font-size: 0.75rem;
      color: var(--text-secondary);
      line-height: 1.4;
      white-space: pre-wrap;
    }

    .card-note a {
      color: var(--accent);
      text-decoration: none;
    }

    .card-note a:hover { text-decoration: underline; }

    .card-check {
      margin-top: 1px;
    }

    .empty {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: center;
      padding: 12px 0;
    }

    .section-divider {
      font-size: 0.7rem;
      color: var(--ui-chrome);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 6px 0 2px;
      border-top: 1px solid var(--panel-border);
      margin-top: 4px;
    }

    #status-bar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
    }

    #status {
      font-size: 0.75rem;
      color: var(--ui-chrome);
    }

    #refresh-btn {
      font-size: 0.75rem;
      padding: 2px 10px;
      white-space: nowrap;
    }

    .shortcut {
      font-size: 0.75rem;
      color: var(--ui-chrome);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    #error {
      color: var(--error);
      font-size: 0.75rem;
    }

    .add-task {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      align-items: stretch;
    }

    .add-task textarea {
      flex: 1;
      resize: none;
      height: 2.8em;
      min-height: unset;
    }

    .add-task .add-btn {
      width: 2.8em;
      height: 2.8em;
      flex-shrink: 0;
      padding: 0;
      justify-content: center;
    }

    .add-task.focused .add-btn {
      background: var(--accent);
      border-color: var(--accent-dark);
      border-bottom-color: var(--accent-dark);
      color: #fff;
    }

    .add-task.focused .add-btn:hover {
      background: var(--accent-hover);
      border-color: var(--accent-dark-hover);
      border-bottom-color: var(--accent-dark-hover);
    }
  </style>
</head>
<body>
  <header>
    <h1>Kanban</h1>
    <div class="shortcut">Quick entry <kbd>⌃⌥Space</kbd></div>
    <div id="status-bar">
      <div id="error"></div>
      <div id="status"></div>
      <button class="btn" id="refresh-btn" onclick="forceRefresh()">Refresh</button>
    </div>
  </header>
  <div id="board">
    <div class="column panel" id="col-backlog">
      <div class="column-header panel-title">Backlog <span class="badge" id="cnt-backlog">0</span></div>
      <div class="cards" id="cards-backlog"></div>
      <div class="add-task" id="add-backlog">
        <textarea class="form-textarea" id="add-input-backlog" placeholder="Add task…" rows="2"></textarea>
        <button class="btn add-btn" title="Add task">+</button>
      </div>
    </div>
    <div class="column panel" id="col-ready">
      <div class="column-header panel-title">Ready <span class="badge" id="cnt-ready">0</span></div>
      <div class="cards" id="cards-ready"></div>
      <div class="add-task" id="add-ready">
        <textarea class="form-textarea" id="add-input-ready" placeholder="Add task…" rows="2"></textarea>
        <button class="btn add-btn" title="Add task">+</button>
      </div>
    </div>
    <div class="column panel active" id="col-inprogress" style="flex: 2">
      <div class="column-header panel-title">In Progress <span class="badge" id="cnt-inprogress">0</span></div>
      <div class="cards" id="cards-inprogress"></div>
      <div class="add-task" id="add-inprogress">
        <textarea class="form-textarea" id="add-input-inprogress" placeholder="Add task…" rows="2"></textarea>
        <button class="btn add-btn" title="Add task">+</button>
      </div>
    </div>
  </div>

  <script>
    const COLUMNS = ["backlog", "ready", "inprogress"];
    const REFRESH_MS = 600000;

    var dragEl = null;    // the card element being dragged
    var pendingMoves = 0; // count of in-flight move requests

    function incPending() {
      pendingMoves++;
      setStatus("Saving…");
    }

    function decPending() {
      pendingMoves--;
      if (pendingMoves <= 0) {
        pendingMoves = 0;
        setStatus("Last updated: " + new Date().toLocaleTimeString());
      }
    }

    var THIRTY_DAYS_MS = 30 * 24 * 60 * 60 * 1000;
    var NINETY_DAYS_MS = 90 * 24 * 60 * 60 * 1000;

    function renderColumn(col, tasks) {
      const cards = document.getElementById("cards-" + col);
      const count = document.getElementById("cnt-" + col);
      count.textContent = tasks.length;
      if (tasks.length === 0) {
        cards.innerHTML = '<div class="empty">No tasks</div>';
      } else {
        var cutoff30 = new Date(Date.now() - THIRTY_DAYS_MS);
        var cutoff90 = new Date(Date.now() - NINETY_DAYS_MS);
        var divider30 = false;
        var divider90 = false;
        var html = "";
        tasks.forEach(function(t) {
          var added = t.added && new Date(t.added);
          if (!divider30 && added && added < cutoff30) {
            html += '<div class="section-divider">Older than 30 days</div>';
            divider30 = true;
          }
          if (!divider90 && added && added < cutoff90) {
            html += '<div class="section-divider">Older than 90 days</div>';
            divider90 = true;
          }
          html += cardHtml(t, col);
        });
        cards.innerHTML = html;
      }

      var col_el = document.getElementById("col-" + col);
      col_el.ondragover = function(e) {
        e.preventDefault();
        col_el.classList.add("drag-over");
      };
      col_el.ondragleave = function(e) {
        if (!col_el.contains(e.relatedTarget)) {
          col_el.classList.remove("drag-over");
        }
      };
      col_el.ondrop = function(e) {
        e.preventDefault();
        col_el.classList.remove("drag-over");
        if (!dragEl) return;

        var id = dragEl.dataset.id;
        var cardsEl = document.getElementById("cards-" + col);

        // Move card in the DOM immediately
        dragEl.classList.remove("dragging");
        cardsEl.appendChild(dragEl);
        updateColumnCounts();
        cleanEmptyPlaceholders();

        // Fire tag update in the background; reload on failure
        incPending();
        fetch("/api/move", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: id, newCol: col })
        })
          .then(function(r) {
            if (!r.ok) throw new Error("HTTP " + r.status);
            decPending();
          })
          .catch(function(err) {
            decPending();
            setError("Failed to move task: " + err.message);
            loadBoard();
          });

        dragEl = null;
      };
    }

    // Tracks pending completion timers: taskId -> setTimeout handle
    var completionTimers = {};

    function cardHtml(task, col) {
      var note = (col === "inprogress" && task.note)
        ? '<div class="card-note">' + linkify(escapeHtml(task.note)) + '</div>'
        : '';
      return '<div class="card" draggable="true" data-id="' + task.id + '"'
        + ' ondragstart="onDragStart(event)"'
        + ' ondragend="onDragEnd(event)">'
        + '<input type="checkbox" class="card-check" title="Mark complete"'
        + ' onchange="onCheckChange(event,\'' + task.id + '\')">'
        + '<div class="card-body">'
        + '<div class="card-name">' + escapeHtml(task.name) + '</div>'
        + note
        + '</div>'
        + '</div>';
    }

    function onCheckChange(e, id) {
      var checked = e.target.checked;
      var card = e.target.closest(".card");

      if (checked) {
        card.classList.add("done");
        // Prevent dragging while pending completion
        card.setAttribute("draggable", "false");

        incPending();
        fetch("/api/complete", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: id })
        })
          .then(function(r) {
            if (!r.ok) throw new Error("HTTP " + r.status);
            decPending();
          })
          .catch(function(err) {
            decPending();
            setError("Failed to complete task: " + err.message);
            card.classList.remove("done");
            card.setAttribute("draggable", "true");
            e.target.checked = false;
          });

        // After 60s, remove from board
        completionTimers[id] = setTimeout(function() {
          delete completionTimers[id];
          card.remove();
          updateColumnCounts();
          cleanEmptyPlaceholders();
        }, 60000);

      } else {
        // Undo: cancel the removal timer and mark incomplete
        if (completionTimers[id]) {
          clearTimeout(completionTimers[id]);
          delete completionTimers[id];
        }
        card.classList.remove("done");
        card.setAttribute("draggable", "true");

        incPending();
        fetch("/api/incomplete", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: id })
        })
          .then(function(r) {
            if (!r.ok) throw new Error("HTTP " + r.status);
            decPending();
          })
          .catch(function(err) {
            decPending();
            setError("Failed to undo completion: " + err.message);
            loadBoard();
          });
      }
    }

    function onDragStart(e) {
      dragEl = e.currentTarget;
      dragEl.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
    }

    function onDragEnd(e) {
      e.currentTarget.classList.remove("dragging");
    }

    // Update the card counts in each column header after a DOM move.
    function updateColumnCounts() {
      COLUMNS.forEach(function(col) {
        var cards = document.getElementById("cards-" + col).querySelectorAll(".card");
        document.getElementById("cnt-" + col).textContent = cards.length;
      });
    }

    // Replace empty columns with the "No tasks" placeholder if needed,
    // and remove stale placeholders from columns that now have cards.
    function cleanEmptyPlaceholders() {
      COLUMNS.forEach(function(col) {
        var cardsEl = document.getElementById("cards-" + col);
        var cards = cardsEl.querySelectorAll(".card");
        var empty = cardsEl.querySelector(".empty");
        if (cards.length === 0 && !empty) {
          cardsEl.innerHTML = '<div class="empty">No tasks</div>';
        } else if (cards.length > 0 && empty) {
          empty.remove();
        }
      });
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // Linkify URLs in already-escaped HTML. Matches http(s):// URLs and
    // wraps them in an anchor tag. Must run after escapeHtml.
    function linkify(escaped) {
      return escaped.replace(
        /https?:\/\/[^\s<>"']*/g,
        function(url) {
          return '<a href="' + url + '" target="_blank" rel="noopener">' + url + '</a>';
        }
      );
    }

    function setStatus(msg) {
      document.getElementById("status").textContent = msg;
    }

    function setError(msg) {
      document.getElementById("error").textContent = msg;
    }

    function forceRefresh() {
      loadBoard(true);
    }

    function loadBoard(force) {
      setError("");
      setStatus(force ? "Refreshing…" : "Loading…");
      fetch(force ? "/api/board?force=true" : "/api/board")
        .then(function(r) {
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.json();
        })
        .then(function(data) {
          COLUMNS.forEach(function(col) {
            renderColumn(col, data[col] || []);
          });
          setStatus("Last updated: " + new Date().toLocaleTimeString());
        })
        .catch(function(err) {
          setStatus("");
          setError("Failed to load board: " + err.message);
        });
    }

    function submitAddTask(col) {
      var textarea = document.getElementById("add-input-" + col);
      var name = textarea.value.trim();
      if (!name) return;
      textarea.value = "";
      document.getElementById("add-" + col).classList.remove("focused");

      incPending();
      setStatus("Adding item…");
      fetch("/api/add", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: name, col: col })
      })
        .then(function(r) {
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.json();
        })
        .then(function(task) {
          decPending();
          var cardsEl = document.getElementById("cards-" + col);
          var empty = cardsEl.querySelector(".empty");
          if (empty) empty.remove();
          cardsEl.insertAdjacentHTML("afterbegin", cardHtml(task, col));
          updateColumnCounts();
        })
        .catch(function(err) {
          decPending();
          setError("Failed to add task: " + err.message);
        });
    }

    COLUMNS.forEach(function(col) {
      var widget = document.getElementById("add-" + col);
      var textarea = document.getElementById("add-input-" + col);
      var btn = widget.querySelector(".add-btn");

      textarea.addEventListener("focus", function() { widget.classList.add("focused"); });
      textarea.addEventListener("blur", function() { widget.classList.remove("focused"); });

      textarea.addEventListener("keydown", function(e) {
        if (e.key === "Enter") {
          e.preventDefault();
          submitAddTask(col);
        }
      });
      btn.addEventListener("click", function() {
        submitAddTask(col);
      });
    });

    loadBoard();
    setInterval(loadBoard, REFRESH_MS);
  </script>
</body>
</html>
