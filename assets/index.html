<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanban</title>
  <link rel="stylesheet" href="/ember.css">
  <link rel="stylesheet" href="/umber-light.css" media="(prefers-color-scheme: light)">
  <link rel="stylesheet" href="/umber-dark.css"  media="(prefers-color-scheme: dark)">
  <link href="/app.css" rel="stylesheet" />
  <script src="//unpkg.com/alpinejs" defer></script>
</head>
<body>
  <header>
    <h1>Kanban</h1>
    <div class="shortcut">Quick entry <kbd>⌃⌥Space</kbd></div>
    <div x-data id="status-bar">
      <div x-text="$store.status.error" id="error"></div>
      <div x-text="$store.status.msg" id="status"></div>
      <button class="btn refresh-btn"
        @click="$dispatch('refresh_board')">Refresh</button>
    </div>
  </header>

  <div x-data="kanban" id="board">
    <template x-data @refresh_board.window="loadBoard(true)"></template>
    <template x-for="(value, key) in board">
    <div class="column panel"
      x-data="{dragCount: 0}"
      :class="{ 'active': key == 'inprogress', 'drag-over': dragCount > 0}"
      :id="'col-' + key"
      @drop="dragCount--; onDrop($event, key)"
      @dragover.prevent="",
      @dragenter="dragCount++"
      @dragleave="dragCount--">

      <div class="column-header panel-title">
        <span x-text="columns[key]">Backlog</span>
        <span x-text="board[key].length" class="badge">0</span>
      </div>

      <div class="cards">

        <template x-for="card in cardsWithSectionDividers(key)">
        <div>

          <template x-if="card._divider"></div>
            <div class="section-divider" x-text="card.label"></div>
          </template>

          <template x-if="!card._divider && !card.editing">
            <div class="card"
              :draggable="!card.done"
              :class="card.done && 'done'"
              @dragstart="onDragStart($event, card, key)">
              <input type="checkbox" class="card-check" title="Mark complete"
                @change="onCardCheckChange($event, card)"
                @checked="card.done">
              <div class="card-body">
                <div x-text="card.name" class="card-name"></div>
                <div x-html="linkify(escapeHtml(card.note))" class="card-note"></div>
              </div>
              <div class="card-actions">
                <button class="btn" title="Edit task"
                  @click="startEdit(card)">Edit</button>
                <button class="btn" title="Delete task"
                  @click="deleteTask(card)">Delete</button>
              </div>
            </div>
          </template>

          <template x-if="!card._divider && card.editing">
            <div class="card" draggable="false">
              <div class="card-body">
                <input type="text" class="form-input"
                  x-model="card.draft.name"><br/>
                <textarea class="form-textarea" rows="6"
                  x-model="card.draft.note"></textarea><br/>
                <button class="btn save-btn" title="Save task"
                  @click="saveEdit(card)" >Save</button>
                <button class="btn cancel-btn"
                  @click="cancelEdit(card)">Cancel</button>
              </div>
            </div>
          </template>

        </div>
        </template>

        <template x-if="board[key].length == 0" id="tmpl-empty">
          <div class="empty">No tasks</div>
        </template>

      </div>
      <div class="add-task" id="add-backlog" x-data="{newTask: ''}">
        <input class="form-input" id="add-input-backlog"
          placeholder="Add task…" rows="2"
          x-model="newTask"
          @keyup.enter.prevent="addTask(key, newTask); newTask='';"></textarea>
        <button class="btn add-btn" title="Add task"
          @click="addTask(key, newTask); newTask='';">+</button>
      </div>
    </div>
    </template>
  </div>


  <script>
    const REFRESH_MS = 600000;
    const THIRTY_DAYS_MS = 30 * 24 * 60 * 60 * 1000;
    const NINETY_DAYS_MS = 90 * 24 * 60 * 60 * 1000;

    document.addEventListener('alpine:init', () => {
      Alpine.store('status', {msg: "", error: ""});
      Alpine.data("kanban", () => ({
        board: {"backlog": [], "ready": [], "inprogress": []},
        columns: {
          "backlog": "Backlog",
          "ready": "Ready",
          "inprogress": "In progress"
        },

        async init() {
          await this.loadBoard();
          // TODO add destroy method clears timer
          setInterval(() => this.loadBoard(false), REFRESH_MS);
        },

        async loadBoard(reloadFromOmnifocus) {
          setError("");
          setStatus(reloadFromOmnifocus ? "Refreshing…" : "Loading…");
          const url = reloadFromOmnifocus ? "/api/board?force=true" : "/api/board";
          try {
            const response = await fetch(url);
            if (!response.ok) {
              throw new Error(`Response status: ${response.status}`);
            }
            const result = await response.json();
            console.log(result);
            for (const col of Object.keys(this.columns)) {
              for (const card of result[col] ?? []) {
                card.editing = false;
                card.done = false;
              }
            }
            this.board = result;
            setStatus("Last updated: " + new Date().toLocaleTimeString());
          } catch (error) {
            console.error(error.message);
            setStatus("");
            setError("Failed to load board: " + error.message);
          }
        },

        // cardsWithSectionDividers inserts headers into the
        // cards column for 30 days old etc.
        cardsWithSectionDividers(col) {
          const cutoff30 = new Date(Date.now() - THIRTY_DAYS_MS);
          const cutoff90 = new Date(Date.now() - NINETY_DAYS_MS);
          const cards = this.board[col];
          let display = [];

          currentSection = "";
          for (const c of cards) {
            const added = c.added && new Date(c.added);
            const section = added > cutoff30 ? null
              : added > cutoff90 ? "Older than 30 days"
              : "Older than 90 days";
            if (section != currentSection) {
              currentSection = section;
              display.push({_divider: true, label: section})
            }

            display.push(c);
          }

          return display;
        },

        // addTask adds task name to a column
        addTask(col, name) {
          console.log(col, name)
          setStatus("Adding item…");
          const b = this.board;
          fetch("/api/add", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name: name, col: col })
          })
            .then(function(r) {
              if (!r.ok) throw new Error("HTTP " + r.status);
              return r.json();
            })
            .then(function(task) {
              b[col].unshift({
                id: task.id,
                name: task.name,
                note: task.note,
                added: new Date(),
                done: false,
                editing: false,
              })
            })
            .catch(function(err) {
              setError("Failed to add task: " + err.message);
            });
        },

        removeCard(card) {
          for (const [col, cards] of Object.entries(this.board)) {
              this.board[col] = cards.filter(c => c.id !== card.id);
          }
        },

        async deleteTask(card) {
          this.removeCard(card);
          try {
            const response = await fetch("/api/delete", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ id: card.id })
            });
            if (!response.ok) {
              throw new Error(`Response status: ${response.status}`);
            }
          } catch (error) {
            console.error(error.message);
            setStatus("");
            setError("Failed to delete task: " + error.message);
            this.loadBoard(false);
          }
        },

        startEdit(card) {
          card.draft = {name: card.name, note: card.note};
          card.editing = true;
        },

        cancelEdit(card) {
          card.draft = {};
          card.editing = false;
        },

        saveEdit(card) {
          card.name = card.draft.name
          card.note = card.draft.note
          card.draft = {};
          card.editing = false;

          fetch("/api/edit", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ id: card.id, name: card.name, note: card.note })
          })
            .then(function(r) {
              if (!r.ok) throw new Error("HTTP " + r.status);
            })
            .catch(function(err) {
              setError("Failed to edit task: " + err.message);
              loadBoard();
            });
        },

        onDragStart(event, card, fromCol) {
          this.dragging = { card, fromCol };
          event.dataTransfer.effectAllowed = 'move';
        },

        onDrop(event, toCol) {
          if (!this.dragging) return;
          const { card, fromCol } = this.dragging;
          this.dragging = null;

          if (fromCol === toCol) return;

          // Remove from source column
          this.board[fromCol] = this.board[fromCol].filter(c => c.id !== card.id);

          // Add to destination column
          this.board[toCol] = [...(this.board[toCol] ?? []), card];

          fetch("/api/move", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ id: card.id, newCol: toCol })
          })
            .then(function(r) {
              if (!r.ok) throw new Error("HTTP " + r.status);
            })
            .catch(function(err) {
              setError("Failed to move task: " + err.message);
              loadBoard();
            });
        },

        completionTimers: {},

        onCardCheckChange(e, card) {
          card.done = !card.done;

          if (card.done) {
            fetch("/api/complete", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ id: card.id })
            })
              .then(function(r) {
                if (!r.ok) throw new Error("HTTP " + r.status);
              })
              .catch(function(err) {
                setError("Failed to complete task: " + err.message);
                card.done = false;
              });

            // After 60s, remove from board
            this.completionTimers[card.id] = setTimeout(function() {
              delete this.completionTimers[card.id];
              this.removeCard(card);
            }, 60000);

          } else {
            // Undo: cancel the removal timer and mark incomplete
            if (this.completionTimers[card.id]) {
              clearTimeout(this.completionTimers[card.id]);
              delete this.completionTimers[card.id];
            }

            fetch("/api/incomplete", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ id: card.id })
            })
              .then(function(r) {
                if (!r.ok) throw new Error("HTTP " + r.status);
              })
              .catch(function(err) {
                setError("Failed to undo completion: " + err.message);
                this.loadBoard();
              });
          }
        },
      }));
    });

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // Linkify URLs in already-escaped HTML. Matches http(s):// URLs and
    // wraps them in an anchor tag. Must run after escapeHtml.
    function linkify(escaped) {
      return escaped.replace(
        /https?:\/\/[^\s<>"']*/g,
        function(url) {
          return '<a href="' + url + '" target="_blank" rel="noopener">' + url + '</a>';
        }
      );
    }

    function setStatus(msg) {
      Alpine.store("status").msg = msg;
    }

    function setError(msg) {
      Alpine.store("status").error = msg;
    }
  </script>
</body>
</html>
