<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanban</title>
  <link rel="stylesheet" href="/ember.css">
  <link rel="stylesheet" href="/umber-light.css" media="(prefers-color-scheme: light)">
  <link rel="stylesheet" href="/umber-dark.css"  media="(prefers-color-scheme: dark)">
  <link href="/app.css" rel="stylesheet" />
  <script src="//unpkg.com/alpinejs" defer></script>
</head>
<body>
  <header>
    <h1>Kanban</h1>
    <div class="shortcut">Quick entry <kbd>⌃⌥Space</kbd></div>
    <div x-data id="status-bar">
      <div x-text="$store.status.error" id="error"></div>
      <div x-text="$store.status.msg" id="status"></div>
      <button class="btn" id="refresh-btn" onclick="forceRefresh()">Refresh</button>
    </div>
  </header>

  <div x-data="kanban" id="board">
    <template x-for="(value, key) in board">
    <div class="column panel"
      x-data="{dragCount: 0}"
      :class="{ 'active': key == 'inprogress', 'drag-over': dragCount > 0}"
      :id="'col-' + key"
      @drop="dragCount--; onDrop($event, key)"
      @dragover.prevent="",
      @dragenter="dragCount++"
      @dragleave="dragCount--">

      <div class="column-header panel-title">
        <span x-text="columns[key]">Backlog</span>
        <span x-text="board[key].length" class="badge">0</span>
      </div>

      <div class="cards">

        <template x-for="card in cardsWithSectionDividers(key)">
        <div>

          <template x-if="card._divider"></div>
            <div class="section-divider" x-text="card.label"></div>
          </template>

          <template x-if="!card._divider && !card.editing">
            <div class="card"
              :draggable="!card.done"
              :class="card.done && 'done'"
              @dragstart="onDragStart($event, card, key)">
              <input type="checkbox" class="card-check" title="Mark complete"
                @change="onCardCheckChange($event, card)"
                @checked="card.done">
              <div class="card-body">
                <div x-text="card.name" class="card-name"></div>
                <div x-text="card.note" class="card-note"></div>
              </div>
              <div class="card-actions">
                <button class="btn" title="Edit task"
                  @click="startEdit(card)">Edit</button>
                <button class="btn" title="Delete task"
                  @click="deleteTask(card)">Delete</button>
              </div>
            </div>
          </template>

          <template x-if="!card._divider && card.editing">
            <div class="card" draggable="false">
              <div class="card-body">
                <input type="text" class="form-input"
                  x-model="card.draft.name"><br/>
                <textarea class="form-textarea" rows="6"
                  x-model="card.draft.note"></textarea><br/>
                <button class="btn save-btn" title="Save task"
                  @click="saveEdit(card)" >Save</button>
                <button class="btn cancel-btn"
                  @click="cancelEdit(card)">Cancel</button>
              </div>
            </div>
          </template>

        </div>
        </template>

        <template x-if="board[key].length == 0" id="tmpl-empty">
          <div class="empty">No tasks</div>
        </template>

      </div>
      <div class="add-task" id="add-backlog" x-data="{newTask: ''}">
        <textarea class="form-textarea" id="add-input-backlog"
          placeholder="Add task…" rows="2"
          x-model="newTask"></textarea>
        <button class="btn add-btn" title="Add task"
          @click="addTask(key, newTask)">+</button>
      </div>
    </div>
    </template>
  </div>

  <!-- ==================== Templates ==================== -->

  <template id="tmpl-edit-form">
    <div class="card-edit-form">
      <label>Name:<input class="form-input"></label>
      <label>Note:<textarea class="form-textarea" rows="3"></textarea></label>
      <div class="form-actions">
        <button class="btn cancel-btn">Cancel</button>
        <button class="btn save-btn">Save</button>
      </div>
    </div>
  </template>

  <script>
    const REFRESH_MS = 600000;

    document.addEventListener('alpine:init', () => {
      Alpine.store('status', {msg: "", error: ""});
      Alpine.data("kanban", () => ({
        board: {"backlog": [], "ready": [], "inprogress": []},
        columns: {
          "backlog": "Backlog",
          "ready": "Ready",
          "inprogress": "In progress"
        },

        async init() {
          await this.loadBoard();
          // TODO add destroy method clears timer
          setInterval(() => this.loadBoard(false), REFRESH_MS);
        },

        async loadBoard(reloadFromOmnifocus) {
          setError("");
          setStatus(reloadFromOmnifocus ? "Refreshing…" : "Loading…");
          const url = reloadFromOmnifocus ? "/api/board?force=true" : "/api/board";
          try {
            const response = await fetch(url);
            if (!response.ok) {
              throw new Error(`Response status: ${response.status}`);
            }
            const result = await response.json();
            console.log(result);
            for (const col of Object.keys(this.columns)) {
              for (const card of result[col] ?? []) {
                card.editing = false;
                card.done = false;
              }
            }
            this.board = result;
            setStatus("Last updated: " + new Date().toLocaleTimeString());
          } catch (error) {
            console.error(error.message);
            setStatus("");
            setError("Failed to load board: " + error.message);
          }
        },

        // cardsWithSectionDividers inserts headers into the
        // cards column for 30 days old etc.
        cardsWithSectionDividers(col) {
          const cutoff30 = new Date(Date.now() - THIRTY_DAYS_MS);
          const cutoff90 = new Date(Date.now() - NINETY_DAYS_MS);
          const cards = this.board[col];
          let display = [];

          currentSection = "";
          for (const c of cards) {
            const added = c.added && new Date(c.added);
            const section = added > cutoff30 ? null
              : added > cutoff90 ? "Older than 30 days"
              : "Older than 90 days";
            if (section != currentSection) {
              currentSection = section;
              display.push({_divider: true, label: section})
            }

            display.push(c);
          }

          return display;
        },

        // addTask adds task name to a column
        addTask(col, name) {
          console.log(col, name)
          setStatus("Adding item…");
          const b = this.board;
          fetch("/api/add", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name: name, col: col })
          })
            .then(function(r) {
              if (!r.ok) throw new Error("HTTP " + r.status);
              return r.json();
            })
            .then(function(task) {
              b[col].unshift({
                id: task.id,
                name: task.name,
                note: task.note,
                added: new Date(),
                done: false,
                editing: false,
              })
            })
            .catch(function(err) {
              setError("Failed to add task: " + err.message);
            });
        },

        removeCard(card) {
          for (const [col, cards] of Object.entries(this.board)) {
              this.board[col] = cards.filter(c => c.id !== card.id);
          }
        },

        async deleteTask(card) {
          this.removeCard(card);
          try {
            const response = await fetch("/api/delete", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ id: card.id })
            });
            if (!response.ok) {
              throw new Error(`Response status: ${response.status}`);
            }
          } catch (error) {
            console.error(error.message);
            setStatus("");
            setError("Failed to delete task: " + error.message);
            this.loadBoard(false);
          }
        },

        startEdit(card) {
          card.draft = {name: card.name, note: card.note};
          card.editing = true;
        },

        cancelEdit(card) {
          card.draft = {};
          card.editing = false;
        },

        saveEdit(card) {
          card.name = card.draft.name
          card.note = card.draft.note
          card.draft = {};
          card.editing = false;

          fetch("/api/edit", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ id: card.id, name: card.name, note: card.note })
          })
            .then(function(r) {
              if (!r.ok) throw new Error("HTTP " + r.status);
            })
            .catch(function(err) {
              setError("Failed to edit task: " + err.message);
              loadBoard();
            });
        },

        onDragStart(event, card, fromCol) {
          this.dragging = { card, fromCol };
          event.dataTransfer.effectAllowed = 'move';
        },

        onDrop(event, toCol) {
          if (!this.dragging) return;
          const { card, fromCol } = this.dragging;
          this.dragging = null;

          if (fromCol === toCol) return;

          // Remove from source column
          this.board[fromCol] = this.board[fromCol].filter(c => c.id !== card.id);

          // Add to destination column
          this.board[toCol] = [...(this.board[toCol] ?? []), card];

          fetch("/api/move", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ id: card.id, newCol: toCol })
          })
            .then(function(r) {
              if (!r.ok) throw new Error("HTTP " + r.status);
            })
            .catch(function(err) {
              setError("Failed to move task: " + err.message);
              loadBoard();
            });
        },

        completionTimers: {},

        onCardCheckChange(e, card) {
          card.done = !card.done;

          if (card.done) {
            fetch("/api/complete", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ id: card.id })
            })
              .then(function(r) {
                if (!r.ok) throw new Error("HTTP " + r.status);
              })
              .catch(function(err) {
                setError("Failed to complete task: " + err.message);
                card.done = false;
              });

            // After 60s, remove from board
            this.completionTimers[card.id] = setTimeout(function() {
              delete this.completionTimers[card.id];
              this.removeCard(card);
            }, 60000);

          } else {
            // Undo: cancel the removal timer and mark incomplete
            if (this.completionTimers[card.id]) {
              clearTimeout(this.completionTimers[card.id]);
              delete this.completionTimers[card.id];
            }

            fetch("/api/incomplete", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ id: card.id })
            })
              .then(function(r) {
                if (!r.ok) throw new Error("HTTP " + r.status);
              })
              .catch(function(err) {
                setError("Failed to undo completion: " + err.message);
                this.loadBoard();
              });
          }
        },
      }));
    });


    var dragEl = null;    // the card element being dragged
    var pendingMoves = 0; // count of in-flight move requests

    function incPending() {
      pendingMoves++;
      setStatus("Saving…");
    }

    function decPending() {
      pendingMoves--;
      if (pendingMoves <= 0) {
        pendingMoves = 0;
        setStatus("Last updated: " + new Date().toLocaleTimeString());
      }
    }

    var THIRTY_DAYS_MS = 30 * 24 * 60 * 60 * 1000;
    var NINETY_DAYS_MS = 90 * 24 * 60 * 60 * 1000;

    function renderColumn(col, tasks) {
      const cards = document.getElementById("cards-" + col);
      const count = document.getElementById("cnt-" + col);
      count.textContent = tasks.length;
      cards.innerHTML = '';
      if (tasks.length === 0) {
        cards.appendChild(document.querySelector("#tmpl-empty").content.cloneNode(true));
      } else {
        var cutoff30 = new Date(Date.now() - THIRTY_DAYS_MS);
        var cutoff90 = new Date(Date.now() - NINETY_DAYS_MS);
        var divider30 = false;
        var divider90 = false;
        tasks.forEach(function(t) {
          var added = t.added && new Date(t.added);
          if (!divider30 && added && added < cutoff30) {
            var d = document.createElement("div");
            d.className = "section-divider";
            d.textContent = "Older than 30 days";
            cards.appendChild(d);
            divider30 = true;
          }
          if (!divider90 && added && added < cutoff90) {
            var d = document.createElement("div");
            d.className = "section-divider";
            d.textContent = "Older than 90 days";
            cards.appendChild(d);
            divider90 = true;
          }
          cards.appendChild(cardEl(t, col));
        });
      }

      var col_el = document.getElementById("col-" + col);
      col_el.ondragover = function(e) {
        e.preventDefault();
        col_el.classList.add("drag-over");
      };
      col_el.ondragleave = function(e) {
        if (!col_el.contains(e.relatedTarget)) {
          col_el.classList.remove("drag-over");
        }
      };
      col_el.ondrop = function(e) {
        e.preventDefault();
        col_el.classList.remove("drag-over");
        if (!dragEl) return;

        var id = dragEl.dataset.id;
        var cardsEl = document.getElementById("cards-" + col);

        // No-op if dropped onto the same column
        if (dragEl.parentElement === cardsEl) {
          dragEl.classList.remove("dragging");
          return;
        }

        // Move card in the DOM immediately
        dragEl.classList.remove("dragging");
        cardsEl.appendChild(dragEl);
        updateColumnCounts();
        cleanEmptyPlaceholders();

        // Fire tag update in the background; reload on failure
        incPending();
        fetch("/api/move", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: id, newCol: col })
        })
          .then(function(r) {
            if (!r.ok) throw new Error("HTTP " + r.status);
            decPending();
          })
          .catch(function(err) {
            decPending();
            setError("Failed to move task: " + err.message);
            loadBoard();
          });

        dragEl = null;
      };
    }

    // Tracks pending completion timers: taskId -> setTimeout handle
    var completionTimers = {};

    function cardEl(task, col) {
      var el = document.querySelector("#tmpl-card").content.cloneNode(true).firstElementChild;

      el.dataset.id = task.id;
      el.dataset.name = task.name;
      el.dataset.note = task.note || '';
      el.addEventListener("dragstart", onDragStart);
      el.addEventListener("dragend", onDragEnd);

      el.querySelector(".card-check").addEventListener("change", function(e) {
        onCheckChange(e, task.id);
      });
      el.querySelector(".card-name").textContent = task.name;
      el.querySelector(".card-note").innerHTML = linkify(escapeHtml(task.note || ''));

      el.querySelector('[title="Edit task"]').addEventListener("click", onEditTask);
      el.querySelector('[title="Delete task"]').addEventListener("click", function(e) {
        onDeleteTask(e, task.id);
      });

      return el;
    }

    function onEditTask(e) {
      e.stopPropagation();
      var card = e.target.closest(".card");
      var id = card.dataset.id;
      var name = card.dataset.name;
      var note = card.dataset.note;

      card.classList.add("editing");
      card.setAttribute("draggable", "false");

      var editForm = document.querySelector("#tmpl-edit-form").content.cloneNode(true).firstElementChild;
      editForm.querySelector(".form-input").value = name;
      editForm.querySelector(".form-textarea").value = note;
      editForm.querySelector(".cancel-btn").addEventListener("click", function(e) { onCancelEdit(e, id); });
      editForm.querySelector(".save-btn").addEventListener("click", function(e) { onSaveEdit(e, id); });

      card.appendChild(editForm);
    }

    function onCancelEdit(e, id) {
      e.stopPropagation();
      var card = e.target.closest(".card");
      card.classList.remove("editing");
      card.setAttribute("draggable", "true");
      card.querySelector(".card-edit-form").remove();
    }

    function onSaveEdit(e, id) {
      e.stopPropagation();
      var card = e.target.closest(".card");
      var name = document.getElementById("edit-name-" + id).value.trim();
      var note = document.getElementById("edit-note-" + id).value.trim();

      if (!name) {
        setError("Task name cannot be empty");
        return;
      }

      // Update the card data attributes
      card.dataset.name = name;
      card.dataset.note = note;

      // Update the card in place immediately
      var cardBody = card.querySelector(".card-body");
      var cardName = cardBody.querySelector(".card-name");
      cardName.textContent = name;

      cardBody.querySelector(".card-note").innerHTML = linkify(escapeHtml(note));

      card.classList.remove("editing");
      card.setAttribute("draggable", "true");
      card.querySelector(".card-edit-form").remove();

      // Fire backend update in the background; reload on failure
      incPending();
      fetch("/api/edit", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: id, name: name, note: note })
      })
        .then(function(r) {
          if (!r.ok) throw new Error("HTTP " + r.status);
          decPending();
        })
        .catch(function(err) {
          decPending();
          setError("Failed to edit task: " + err.message);
          loadBoard();
        });
    }

    function onDeleteTask(e, id) {
      e.stopPropagation();
      var card = e.target.closest(".card");
      card.remove();
      updateColumnCounts();
      cleanEmptyPlaceholders();

      incPending();
      fetch("/api/delete", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: id })
      })
        .then(function(r) {
          if (!r.ok) throw new Error("HTTP " + r.status);
          decPending();
        })
        .catch(function(err) {
          decPending();
          setError("Failed to delete task: " + err.message);
          loadBoard();
        });
    }

    function onCheckChange(e, id) {
      var checked = e.target.checked;
      var card = e.target.closest(".card");

      if (checked) {
        card.classList.add("done");
        // Prevent dragging while pending completion
        card.setAttribute("draggable", "false");

        incPending();
        fetch("/api/complete", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: id })
        })
          .then(function(r) {
            if (!r.ok) throw new Error("HTTP " + r.status);
            decPending();
          })
          .catch(function(err) {
            decPending();
            setError("Failed to complete task: " + err.message);
            card.classList.remove("done");
            card.setAttribute("draggable", "true");
            e.target.checked = false;
          });

        // After 60s, remove from board
        completionTimers[id] = setTimeout(function() {
          delete completionTimers[id];
          card.remove();
          updateColumnCounts();
          cleanEmptyPlaceholders();
        }, 60000);

      } else {
        // Undo: cancel the removal timer and mark incomplete
        if (completionTimers[id]) {
          clearTimeout(completionTimers[id]);
          delete completionTimers[id];
        }
        card.classList.remove("done");
        card.setAttribute("draggable", "true");

        incPending();
        fetch("/api/incomplete", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: id })
        })
          .then(function(r) {
            if (!r.ok) throw new Error("HTTP " + r.status);
            decPending();
          })
          .catch(function(err) {
            decPending();
            setError("Failed to undo completion: " + err.message);
            loadBoard();
          });
      }
    }

    function onDragStart(e) {
      dragEl = e.currentTarget;
      dragEl.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
    }

    function onDragEnd(e) {
      e.currentTarget.classList.remove("dragging");
    }

    // Update the card counts in each column header after a DOM move.
    function updateColumnCounts() {
      COLUMNS.forEach(function(col) {
        var cards = document.getElementById("cards-" + col).querySelectorAll(".card");
        document.getElementById("cnt-" + col).textContent = cards.length;
      });
    }

    // Replace empty columns with the "No tasks" placeholder if needed,
    // and remove stale placeholders from columns that now have cards.
    function cleanEmptyPlaceholders() {
      COLUMNS.forEach(function(col) {
        var cardsEl = document.getElementById("cards-" + col);
        var cards = cardsEl.querySelectorAll(".card");
        var empty = cardsEl.querySelector(".empty");
        if (cards.length === 0 && !empty) {
          cardsEl.appendChild(document.querySelector("#tmpl-empty").content.cloneNode(true));
        } else if (cards.length > 0 && empty) {
          empty.remove();
        }
      });
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // Linkify URLs in already-escaped HTML. Matches http(s):// URLs and
    // wraps them in an anchor tag. Must run after escapeHtml.
    function linkify(escaped) {
      return escaped.replace(
        /https?:\/\/[^\s<>"']*/g,
        function(url) {
          return '<a href="' + url + '" target="_blank" rel="noopener">' + url + '</a>';
        }
      );
    }

    function setStatus(msg) {
      Alpine.store("status").msg = msg;
    }

    function setError(msg) {
      Alpine.store("status").error = msg;
    }

    function forceRefresh() {
      loadBoard(true);
    }

    function loadBoard(force) {
      setError("");
      setStatus(force ? "Refreshing…" : "Loading…");
      fetch(force ? "/api/board?force=true" : "/api/board")
        .then(function(r) {
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.json();
        })
        .then(function(data) {
          COLUMNS.forEach(function(col) {
            renderColumn(col, data[col] || []);
          });
          setStatus("Last updated: " + new Date().toLocaleTimeString());
        })
        .catch(function(err) {
          setStatus("");
          setError("Failed to load board: " + err.message);
        });
    }

    function submitAddTask(col) {
      var textarea = document.getElementById("add-input-" + col);
      var name = textarea.value.trim();
      if (!name) return;
      textarea.value = "";
      document.getElementById("add-" + col).classList.remove("focused");

      incPending();
      setStatus("Adding item…");
      fetch("/api/add", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: name, col: col })
      })
        .then(function(r) {
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.json();
        })
        .then(function(task) {
          decPending();
          var cardsEl = document.getElementById("cards-" + col);
          var empty = cardsEl.querySelector(".empty");
          if (empty) empty.remove();
          cardsEl.prepend(cardEl(task, col));
          updateColumnCounts();
        })
        .catch(function(err) {
          decPending();
          setError("Failed to add task: " + err.message);
        });
    }

      var textarea = document.getElementById("add-input-" + col);
      var btn = widget.querySelector(".add-btn");

      textarea.addEventListener("focus", function() { widget.classList.add("focused"); });
      textarea.addEventListener("blur", function() { widget.classList.remove("focused"); });

      textarea.addEventListener("keydown", function(e) {
        if (e.key === "Enter") {
          e.preventDefault();
          submitAddTask(col);
        }
      });
      btn.addEventListener("click", function() {
        submitAddTask(col);
      });
    });
*/
  </script>
</body>
</html>
